[project]
name = "vadsa"
version = "0.1.0"
description = "Swedish speech recognition server for KlangAI/pianissimo-sv with a vLLM-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Sundsvalls Kommun" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/eneo-ai/vadsa"
Issues = "https://github.com/eneo-ai/vadsa/issues"

[project.optional-dependencies]
nemo = [
    "nemo_toolkit[asr]==3.0.0",
]
cpu = [
    "torch>=2.6",
]
gpu = [
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vadsa"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
